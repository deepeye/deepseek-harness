# The dsh remote task service over dsh-base. An unattended service has no one
# to ask, so the profile composes the fail-closed `never` approval policy and
# pins the default permission preset to a matching `service` entry
# (workspace-write sandbox, rejects approval-needing operations). The other
# presets stay selectable; the base layer's DSH_PERMISSION_MODE still sets the
# process sandbox fallback, while sessions created by the task service pin the
# `service` preset unless a deployment restates `defaultPreset`.
#
# A patch replaces the targeted row's whole `config`, so the permission row
# restates every preset the base layer declared.

- id: approval
  config:
    policy: 'never'

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      service:
        sandbox: workspace-write
        approval: never
        name: service
        description: 'Unattended — write inside the workspace; approval-needing operations are rejected.'
    defaultPreset: 'service'

- insert:
    # Ordinary provider for the parsed service flags and their environment
    # fallbacks (DSH_SERVICE_HOST / DSH_SERVICE_PORT). It fully resolves the
    # listen pair so an invalid environment value fails at parse time; no
    # launcher metadata or special row kind is needed.
    - id: service-startup
      name: '@deepseek-ai/dsh-service-app/startup'

    # Plain route-registration carrier; host and port are the serviceStartup
    # provider's resolved values (flag first, environment fallback, default).
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [serviceStartup]
      config:
        host: !!js ctx.serviceStartup.host
        port: !!js ctx.serviceStartup.port

    - id: task-service
      name: '@deepseek-ai/dsh-task-service'
      config:
        token: !!js "process.env.DSH_SERVICE_TOKEN ?? ''"
        webhookUrl: !!js "process.env.DSH_SERVICE_WEBHOOK_URL || undefined"
